<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lubbock Economic Dashboard</title>
<!-- Fonts. Antonio = headings. Greycliff CF = body (used if installed; Figtree is the free stand-in). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart library (draws the big line charts). Loaded from the internet. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- YOUR DATA. The Python script rewrites this file; nothing in this page needs editing. -->
<script src="dashboard_data.js"></script>
<style>
  /* ---------- LEDA brand colors (Traditional palette) ---------- */
  :root {
    color-scheme: light;
    --black: #040707;      /* LEDA black */
    --slate: #243746;      /* LEDA slate */
    --teal:  #006072;      /* LEDA teal (accent) */
    --taupe: #c5b9ac;      /* LEDA taupe */
    --ink:   #040707;
    --ink-2: #3d4a55;
    --ink-3: #7d7368;
    --line:  #e3ddd6;
    --card:  #ffffff;
    --page:  #f5f2ee;
    --chip:  #eee8e1;
	--good:  #028350;      /*arrow color when the change is good news*/
	--bad:   #b42318;      /*arrow color when the change is bad news*/
    /* Fonts */
    --head: "Antonio", "Arial Narrow", sans-serif;
    --body: "Greycliff CF", "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--body);
    font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- Header ---------- */
  header {
    background: var(--slate); color: #fff; border-radius: 14px;
    padding: 26px 28px; display: flex; flex-wrap: wrap; gap: 20px;
    align-items: center; justify-content: space-between;
    border-bottom: 5px solid var(--teal);
  }
  h1 { margin: 4px 0 0; font-family: var(--head); font-size: 48px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; line-height: 1.05; }
  .brand { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .logo { height: 56px; width: auto; display: block; }
  .updated { font-size: 13px; color: var(--taupe); text-align: right; }
  .updated b { color: #fff; font-weight: 600; display: block; font-size: 14px; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 6px; margin-top: 18px; padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 1 0 auto; border: 0; background: transparent; cursor: pointer;
    padding: 10px 18px; border-radius: 8px; white-space: nowrap;
    font-family: var(--head); font-size: 17px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-2);
  }
  .tabs button:hover { background: var(--chip); }
  .tabs button[aria-selected="true"] { background: var(--teal); color: #fff; }

  /* ---------- Section intro + geography switch ---------- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 16px; }
  .intro { font-size: 14px; color: var(--ink-2); max-width: 640px; }
  .geo { display: flex; align-items: center; gap: 12px; }
  .geo .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .seg button {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 7px;
    font: inherit; font-weight: 600; color: var(--ink-2); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--slate); color: #fff; }

  /* ---------- Cards ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(max(220px, calc((100% - 48px) / 4)), 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 20px 16px; border-top: 4px solid var(--slate);
    display: flex; flex-direction: column; min-height: 230px;
  }
  .card.lead { border-top-color: var(--teal); }
  .card h3 { margin: 0; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; text-align: center; }
  .card .subtitle { font-size: 12.5px; color: var(--ink-3); min-height: 1.45em; margin-top: 3px; text-align: center; }
  .value { font-family: var(--head); font-size: 46px; font-weight: 600; letter-spacing: .01em; line-height: 1.1; margin: 8px 0 8px; font-variant-numeric: tabular-nums; }
  .meta { font-size: 12.5px; color: var(--ink-3); }
  .chip {
    display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px;
    background: var(--chip); font-size: 12.5px; font-weight: 600; color: var(--ink);
    font-variant-numeric: tabular-nums; align-self: flex-start;
  }
  .arrow.good { color: var(--good); }
  .arrow.bad { color: var(--bad); }
  .compare { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-2); }
  .compare b { display: block; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .note { margin-top: 8px; font-size: 12px; color: var(--ink-3); font-style: italic; }

  /* Trend line at the bottom of each card, now with a caption and dates */
  .spark { margin-top: auto; padding-top: 14px; }
  .spark-title { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; }
  .spark svg { width: 100%; height: 40px; display: block; overflow: visible; }
  .spark-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* ---------- Chart panel ---------- */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; grid-column: 1 / -1; min-width: 0; }
  /* Charts sit in a two-column grid. Most span both columns; half: true takes one,
     so two half charts in a row sit side by side. Phones get one column. */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .panel.half { grid-column: auto; }
  @media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }
  .panel h2 { margin: 0; font-family: var(--head); font-size: 26px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .panel .meta { margin: 4px 0 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 7px; vertical-align: middle;
    /* Draws the legend sample as solid, dotted, or dashed to match its line. */
    background: repeating-linear-gradient(90deg, var(--c) 0 var(--on, 18px), transparent var(--on, 18px) var(--gap, 18px)); }
  .chart-box { position: relative; height: 320px; }

  /* Bar-chart extras: header row with the growth callout on the right */
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .callout { text-align: right; }
  .callout-num { display: block; font-family: var(--head); font-size: 40px; font-weight: 600; line-height: 1; color: var(--ink); }
  .callout-num.good { color: var(--good); }
  .callout-num.bad { color: var(--bad); }
  .callout-lbl { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

  /* Industry explorer: the dropdown and the one-line summary */
  .picker { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .picker select { font: 500 14px var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; max-width: 100%; cursor: pointer; }
  .readout { font-size: 14px; color: var(--ink-2); margin-bottom: 12px; }
  .readout b { color: var(--ink); }
  .chart-note { margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-style: italic; }

  /* ---------- "Coming soon" block for tabs without data yet ---------- */
  .empty {
    background: var(--card); border: 1px dashed var(--taupe); border-radius: 14px;
    padding: 48px 24px; text-align: center; color: var(--ink-2); margin-top: 22px;
  }
  .empty h2 { font-family: var(--head); font-size: 28px; font-weight: 600; text-transform: uppercase; margin: 0 0 6px; color: var(--slate); }

  footer { margin-top: 22px; font-size: 12px; color: var(--ink-3); }
  .error { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
      <div class="brand">
	    <img class="logo" src="LEDA Logo_white.png" alt="Lubbock Economic Development Alliance">
      <h1>Economic Dashboard</h1>
    </div>
    <div class="updated">Data updated<b id="updated">—</b></div>
  </header>

  <!-- Tab buttons are created by the code below from the TABS list. -->
  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="controls">
    <div class="intro" id="intro"></div>
    <div class="geo" id="geo">
      <span class="label">Geography</span>
      <div class="seg" id="geo-switch">
        <button data-geo="City of Lubbock">City</button>
        <button data-geo="Lubbock County">County</button>
        <button data-geo="Lubbock MSA">MSA</button>
      </div>
    </div>
  </div>

  <main id="content"></main>

  <footer>Every figure shows its source and the period it covers. Data releases run on different schedules, so periods can differ between cards.</footer>
</div>

<script>
/* =====================================================================
   HOW THIS PAGE WORKS
   1. dashboard_data.js (made by the Python script) loads first and puts
      all the numbers in window.DASHBOARD_DATA.
   2. The TABS list below says which cards and charts go on each tab.
   3. The code builds the chosen tab. Clicking a tab or City / County / MSA
      rebuilds it. The page remembers the visitor's last tab and geography.
   ===================================================================== */

const DATA = window.DASHBOARD_DATA;
const TEAL = "#006072", SLATE = "#243746", TAUPE = "#a39686"; // taupe darkened a touch so the line is readable on white

/* ---------------------------------------------------------------------
   THE TABS. This is the one place that decides what's on each tab.
     geo:    true = show the City / County / MSA switch on this tab
     intro:  the sentence under the tabs
     cards:  which metrics get a card (names match the Python script)
     charts: which big charts go under the cards. Two kinds:
       Line chart settings: (all optional except metric ):
	      { metric: "metric_name"            a line chart: last 36 months vs Texas & U.S.
		  years:    how many years to show. The default depends on the data: 3 years for monthly, 5 for quarterly, 10 for yearly.
		  compareTo: which places to draw alongside the main line. If you leave it off, you get Texas and United States. If you include it,
		            only the places you list are drawn.
		  endLabels: true = this shows the most recent value for each line.
       Bar chart settings (all optional except metric and type):
	      { metric: "metric_name", type: "bars", ... }   one bar per year.
           years:     how many bars (default 10)
           yearly:    "sum" or "average" to turn monthly/quarterly data into
                      one number per year. Leave it off for yearly data.
           callout:   true = big "first year vs last full year" growth number,
                      or [2017, 2025] to pick the two years yourself or callout: 10 to show the last full year
					  vs 10 years before it.
           goodWhen:  "up" (default), "down", or "neither" = callout number color. This is only used in cases where a down number is good
		              or a number just is (neither).
           barLabels: "ends" (default), "all", or "none", or a list of positions like [1, 6, -3, -2, -1] (1 = first bar, -1 = last bar) = values on the bars
       Ranking chart (Industry tab): one sideways bar per item, sorted.
          { type: "ranking", title: "...", show: "size" or "growth", prefix: "jobs: ", metrics: SUPERSECTORS }
           show: "size"   = biggest at the top, labeled with its share of the total
                 "growth" = fastest growing at the top, change from a year ago, green up / red down
           by:     (growth only) "percent" (default) or "jobs" = rank and label by number of jobs gained or lost
           shareOf: (size only) what the % labels are a share of, e.g. "Total Private". Leave it off and
                   it's a share of the bars shown.
           note:   a sentence printed under the chart
           views:  instead of metrics, two or more named lists, e.g. { "Sectors": LIST1, "Detailed": LIST2 }.
                   Adds buttons to switch between them. The first one shows by default.
   Any chart: half: true = half width (two cards wide). Put two half charts next
   to each other in the list and they sit side by side.
           prefix: added to the front of each name in the list to get the metric name
       Explorer (Industry tab): a dropdown menu + a line chart of the chosen item.
          { type: "explorer", title: "...", prefix: "jobs: ", menu: INDUSTRY_MENU, years: 5 }
   Card settings, besides lead / compareTo / goodWhen / chip:
       title:     a shorter name for the card than the metric's label
       compareAs: "change" = the compareTo places show their change from a year ago
                  instead of their value (good when the numbers are wildly different sizes)
   A tab with no cards shows a "coming soon" message.
   --------------------------------------------------------------------- */

/* The 10 big industry groups (BLS "supersectors"). They don't overlap,
   and together they add up to Total Nonfarm, so they're safe to rank
   side by side. */
const SUPERSECTORS = [
  "Mining, Logging and Construction",
  "Manufacturing",
  "Trade, Transportation, and Utilities",
  "Information",
  "Financial Activities",
  "Professional and Business Services",
  "Private Education and Health Services",
  "Leisure and Hospitality",
  "Other Services",
];

/* The detailed view of "Where Lubbock's Jobs Are": the sectors above, split
   into their pieces wherever we have them. Still no overlaps, so it still
   adds up to Total Private. Private Educational Services and Arts,
   Entertainment, and Recreation are calculated in the Python script. */
const DETAILED = [
  "Mining, Logging and Construction",
  "Manufacturing",
  "Wholesale Trade",
  "Retail Trade",
  "Transportation, Warehousing, and Utilities",
  "Information",
  "Financial Activities",
  "Professional and Business Services",
  "Health Care and Social Assistance",
  "Private Educational Services",
  "Accommodation and Food Services",
  "Arts, Entertainment, and Recreation",
  "Other Services",
];

/* Government, broken into its three parts, for its own chart. */
const GOVERNMENT = [
  "Federal Government",
  "State Government",
  "Local Government",
];

/* The industry dropdown, in Texas LMI's order. Each dash = one level
   indented, so visitors can see what's part of what. */
const INDUSTRY_MENU = [
  "Total Nonfarm",
  "- Total Private",
  "- Goods Producing",
  "-- Mining, Logging and Construction",
  "-- Manufacturing",
  "- Service-Providing",
  "- Private Service Providing",
  "-- Trade, Transportation, and Utilities",
  "--- Wholesale Trade",
  "--- Retail Trade",
  "--- Transportation, Warehousing, and Utilities",
  "-- Information",
  "-- Financial Activities",
  "-- Professional and Business Services",
  "-- Private Education and Health Services",
  "--- Health Care and Social Assistance",
  "-- Leisure and Hospitality",
  "--- Accommodation and Food Services",
  "-- Other Services",
  "- Government",
  "-- Federal Government",
  "-- State Government",
  "-- Local Government",
];

const TABS = [
  {
    id: "overview", label: "Overview", geo: true,
    intro: "The headline numbers for Lubbock's economy, updated as new data is released.",
    cards: [
	  { metric: "population" }, 
      { metric: "unemployment_rate", lead: true, compareTo: ["Texas", "United States"], goodWhen: "down" },
      { metric: "nonfarm_jobs" },
	  { metric: "labor_force" }
    ],
    charts: ["unemployment_rate"],
  },
  {
    id: "demographics", label: "Demographics", geo: true,
    intro: "Population, age, and household characteristics.",
    cards: [
	  {metric: "population"},
      {metric: "med_age_workforce"}, 	  
	], 
	charts: [],
  },
  {
    id: "economy", label: "Economy", geo: true,
    intro: "Sales tax, construction, real estate, energy, and agriculture.",
    cards: [
	  {metric: "sales_tax"}, 
	  {metric: "coli", goodWhen: "down", chip: "vsBaseline", baseline: 100, baselineLabel: "U.S. average" }, 
	], 
	charts: [
	   {metric: "sales_tax", type: "bars", yearly: "sum", years: 12, callout: 10, barLabels: [1, 6, -3, -2, -1] }, 
	],
  },
  {
    id: "housing", label: "Housing", geo: true, 
	intro: "Economic indicators from the housing market.", 
	cards: [
	  { metric: "median_price", lead: true, compareTo: ["Texas", "United States"], goodWhen: "neither" }, 
	  { metric: "homes_sold" }, 
	  { metric: "new_res_permits" }, 
	  { metric: "apartment_occupancy" }
	], 
	charts: ["median_price"],
  },
  {
    id: "industry", label: "Industry", geo: false,
    intro: "Jobs located in the Lubbock MSA, by industry. Industry data is published for the metro area only.",
    cards: [
      { metric: "jobs: Total Nonfarm", title: "Nonfarm Jobs", lead: true, compareTo: ["Texas"], compareAs: "change" },
      { metric: "jobs: Private Education and Health Services", title: "Education & Health", compareTo: ["Texas"], compareAs: "change" },
      { metric: "jobs: Trade, Transportation, and Utilities", title: "Trade & Transportation", compareTo: ["Texas"], compareAs: "change" },
      { metric: "jobs: Manufacturing", title: "Manufacturing", compareTo: ["Texas"], compareAs: "change" },
    ],
    charts: [
      { type: "ranking", show: "size", title: "Where Lubbock's Jobs Are", prefix: "jobs: ", shareOf: "Total Private", half: true,
        views: { "Sectors": SUPERSECTORS, "Detailed": DETAILED } },
      { type: "ranking", show: "size", title: "Government Jobs", prefix: "jobs: ", metrics: GOVERNMENT, shareOf: "Government", half: true,
        note: "Texas Tech University and Texas Tech University Health Sciences Center employees are counted as State Government." },
      { type: "ranking", show: "growth", by: "jobs", title: "Which Industries Are Growing", prefix: "jobs: ",
        views: { "Sectors": SUPERSECTORS.concat(["Government"]), "Detailed": DETAILED.concat(["Government"]) } },
      { type: "explorer", title: "Explore an Industry", prefix: "jobs: ", menu: INDUSTRY_MENU, years: 5 },
    ],
  },
  {
    id: "tourism", label: "Tourism", geo: false,
    intro: "Hotel performance, hotel occupancy tax, and air travel.",
    cards: [
	  { metric: "enplanements" }, 
	], 
	
	charts: [],
  },
  {
    id: "labor", label: "Workforce", geo: true,
    intro: "Employment, unemployment, and job postings.",
    cards: [
      { metric: "unemployment_rate", lead: true, compareTo: ["Texas", "United States"], goodWhen: "down" },
      { metric: "labor_force" },
      { metric: "employment" },
      { metric: "job_postings" },
    ],
    charts: [
	   { metric: "unemployment_rate", type: "bars", yearly: "average", years: 5, callout: 3, goodWhen: "down" }, 
	   { metric: "regional_unemployment", compareTo: ["Texas", "United States", "Amarillo", "Midland"], endLabels: true }, 
	   ],
  },
];

/* ---------- Remembering the visitor's choices ----------
   Saved in the visitor's own browser. Wrapped in try/catch because some
   browsers (private windows, strict settings) block saving; the page
   still works, it just won't remember. */
function recall(key, fallback) {
  try { return localStorage.getItem("leda-dashboard-" + key) || fallback; } catch (e) { return fallback; }
}
function remember(key, value) {
  try { localStorage.setItem("leda-dashboard-" + key, value); } catch (e) {}
}

const GEOS = ["City of Lubbock", "Lubbock County", "Lubbock MSA"];
let currentGeo = recall("geo", "Lubbock MSA");
if (!GEOS.includes(currentGeo)) currentGeo = "Lubbock MSA";

// A link like index.html#labor opens straight to that tab; otherwise use the last tab visited.
let currentTab = location.hash.slice(1) || recall("tab", "overview");
if (!TABS.find(t => t.id === currentTab)) currentTab = "overview";

let charts = [];

/* ---------- Small helpers for formatting ---------- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parts(d) { const [y, m] = d.split("-").map(Number); return { y, m }; }
function periodLabel(d, freq) {
  const { y, m } = parts(d);
  if (freq === "annual") return `${y}`;
  return freq === "quarterly" ? `Q${Math.floor((m - 1) / 3) + 1} ${y}` : `${MONTHS[m - 1]} ${y}`;
}
function shortPeriod(d, freq) {
  const { y, m } = parts(d);
  if (freq === "annual") return `${y}`;
  return freq === "quarterly" ? `Q${Math.floor((m - 1) / 3) + 1} ${y}` : `${SHORT[m - 1]} ${y}`;
}
function fmt(v, unit) {
  if (v == null) return "—";
  if (unit === "percent") return v.toFixed(1) + "%";
  if (unit === "dollars") return "$" + Math.round(v).toLocaleString();
  if (unit === "index") return v.toFixed(1);
  if (unit === "decimal") return v.toFixed(1); 
  if (unit === "years") return v.toFixed(1); 
  return Math.round(v).toLocaleString();
}

/* Latest period that actually has a number (skips blanks). */
function latest(series) {
  for (let i = series.length - 1; i >= 0; i--) if (series[i][1] != null) return series[i];
  return null;
}
/* Value for the same period one year earlier. */
function yearAgo(series, date) {
  const target = (parts(date).y - 1) + date.slice(4);
  const hit = series.find(p => p[0] === target);
  return hit ? hit[1] : null;
}

/* If a metric isn't published for the chosen geography, use the next best one. */
const FALLBACK = {
  "City of Lubbock": ["City of Lubbock", "Lubbock MSA", "Lubbock County"],
  "Lubbock County":  ["Lubbock County", "Lubbock MSA", "City of Lubbock"],
  "Lubbock MSA":     ["Lubbock MSA", "Lubbock County", "City of Lubbock"],
};
function pickGeo(metric, geo) {
  // Metrics with only one geography (like a single "Lubbock" series) use whatever they have.
  return FALLBACK[geo].find(g => metric.series[g]) || Object.keys(metric.series)[0] || null;
}

/* ---------- Trend line at the bottom of each card ----------
   Shows 2 years of monthly data, 3 years of quarterly data, and 10 years of annual data, labeled
   with a caption and the start and end dates so it's clear what it is.
   Low and high points are marked with their values. */
function sparkline(series, metric) {
  const count = { monthly: 24, quarterly: 12, annual: 10 }[metric.frequency];
  const span = { monthly: "2-year trend", quarterly: "3-year trend", annual: "10-year trend" }[metric.frequency];
  const pts = series.slice(-count);
  const real = pts.filter(p => p[1] != null);
  if (real.length < 2) return "";
  const vals = real.map(p => p[1]);
  const min = Math.min(...vals), max = Math.max(...vals), range = (max - min) || 1;
  const W = 200, H = 40, pad = 4;
  const xy = (i, v) => [(i / (pts.length - 1)) * W, H - pad - ((v - min) / range) * (H - pad * 2)];

  let d = "", pen = false ;
  pts.forEach((p, i) => {
    if (p[1] == null) { pen = false; return; }
    const [x, y] = xy(i, p[1]);
    d += (pen ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    pen = true;
  });

  return `<div class="spark">
    <div class="spark-title">${span} · low ${fmt(min, metric.unit)} · high ${fmt(max, metric.unit)}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${span} for ${metric.label}">
      <path d="${d}" fill="none" stroke="${TEAL}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>    </svg>
    <div class="spark-axis"><span>${shortPeriod(pts[0][0], metric.frequency)}</span><span>${shortPeriod(pts[pts.length - 1][0], metric.frequency)}</span></div>
  </div>`;
}

/* ---------- Build one card ---------- */
function card(opts) {
  const m = DATA.metrics[opts.metric];
  if (!m) return "";
  const geo = pickGeo(m, currentGeo);
  if (!geo) return "";
  const series = m.series[geo];
  const [date, value] = latest(series);
  const prior = yearAgo(series, date);

  // Change vs. a year ago. Units in DIFF_LABELS show a difference; everything else shows percent.
  let chip = "";
  if (opts.chip === "vsBaseline") {
    // Compare to a fixed reference point (like "U.S. average = 100") instead of a year ago.
    const pctDiff = ((value - opts.baseline) / opts.baseline) * 100;
    const arrow = pctDiff > 0 ? "▲" : "▼";
    const goodWhen = opts.goodWhen || "up";
    const tone = Math.abs(pctDiff) < 0.05 || goodWhen === "neither" ? "flat"
               : (pctDiff > 0) === (goodWhen === "up") ? "good" : "bad";
    const side = pctDiff > 0 ? "above" : "below";
    const text = Math.abs(pctDiff) < 0.05
      ? `At ${opts.baselineLabel}`
      : `<span class="arrow ${tone}">${arrow}</span> ${Math.abs(pctDiff).toFixed(1)}% ${side} ${opts.baselineLabel}`;
    chip = `<span class="chip">${text}</span>`;
  } else if (prior != null) {
    const DIFF_LABELS = { percent: " pts", index: " pts", years: " yrs" };
    const label = DIFF_LABELS[m.unit];
    const diff = label ? value - prior : ((value - prior) / prior) * 100;
    const arrow = diff > 0 ? "▲" : "▼";
	// Is this change good news, bad news, or neither? Set per card with goodWhen in TABS.
	const goodWhen = opts.goodWhen || "up"; 
	const tone = Math.abs(diff) < 0.05 || goodWhen === "neither" ? "flat" : (diff > 0) === (goodWhen === "up") ? "good" : "bad"; 
    const amt = Math.abs(diff).toFixed(1) + (label || "%");
    const text = Math.abs(diff) < 0.05 ? "No change" : `<span class="arrow ${tone}">${arrow}</span> ${amt}`;
    const priorDate = (parts(date).y - 1) + date.slice(4);
    chip = `<span class="chip">${text} vs ${shortPeriod(priorDate, m.frequency)} (${fmt(prior, m.unit)})</span>`;
  }

  // Optional comparison row (e.g. Texas and U.S.) for the same period.
  let compare = `<div class="compare"></div>`;
  if (opts.compareTo) {
    const cells = opts.compareTo.filter(g => m.series[g]).map(g => {
      const hit = m.series[g].find(p => p[0] === date);
      if (opts.compareAs === "change") {
        // Show that place's change from a year ago, e.g. "Texas vs year ago  ▲ 1.9%".
        const now = hit ? hit[1] : null, then = yearAgo(m.series[g], date);
        const pct = now != null && then ? ((now - then) / then) * 100 : null;
        const shown = pct == null ? "—" : Math.abs(pct) < 0.05 ? "No change"
          : `<span class="arrow ${pct > 0 ? "good" : "bad"}">${pct > 0 ? "▲" : "▼"}</span> ${Math.abs(pct).toFixed(1)}%`;
        return `<div>${g} vs year ago<b>${shown}</b></div>`;
      }
      return `<div>${g}<b>${fmt(hit ? hit[1] : null, m.unit)}</b></div>`;
    }).join("");
    compare = `<div class="compare">${cells}</div>`;
  }

  // Say so when we had to substitute a different geography.
  // (Only on tabs that have the geography switch.)
  const tabUsesGeo = TABS.find(t => t.id === currentTab).geo;
  const note = tabUsesGeo && geo !== currentGeo ? `<div class="note">Not published for ${currentGeo}; showing ${geo}.</div>` : "";

  return `<article class="card ${opts.lead ? "lead" : ""}">
    <h3>${opts.title || m.label}</h3>
	<div class="subtitle">${m.subtitle || ""}</div>
    <div class="value">${fmt(value, m.unit)}</div>
    <div class="meta">${geo} · ${periodLabel(date, m.frequency)}<br>${m.source}</div>
    ${chip}${compare}${note}
    ${sparkline(series, m)}
  </article>`;
}

/* ---------- Big line chart: chosen geography vs other places ---------- */

/* A chart in TABS can be written two ways: just "metric_name" (a line chart)
   or { metric: "...", ... } with settings. This turns both into the second form. */
function chartOpts(entry) {
  return typeof entry === "string" ? { metric: entry, type: "line" } : entry;
}

/* The box each big chart sits in: title, description line, callout, legend. */
function chartPanel(entry, index) {
  const o = chartOpts(entry);
  if (o.type === "ranking" || o.type === "explorer") return listPanel(o, index);
  const m = DATA.metrics[o.metric];
  if (!m) return "";
  const meta = o.type === "bars"
    ? `${m.subtitle ? m.subtitle + " · " : ""}One bar per year · ${m.source}`
    : `${m.subtitle ? m.subtitle + " · " : ""}Last ${lineYears(o, m)} years · ${m.source} · Gaps mean no data was released for that period.`;
  return `<section class="panel${o.half ? " half" : ""}">
    <div class="panel-head">
      <div>
        <h2>${m.label}</h2>
        <div class="meta">${meta}</div>
      </div>
      <div class="callout" id="callout-${index}"></div>
    </div>
    <div class="legend" id="legend-${index}"></div>
    <div class="chart-box"><canvas id="chart-${index}"></canvas></div>
  </section>`;
}

/* How many points make a year, and how many years a line chart shows
   if the chart doesn't say (its "years:" setting). */
const PER_YEAR = { monthly: 12, quarterly: 4, annual: 1 };
const DEFAULT_LINE_YEARS = { monthly: 3, quarterly: 5, annual: 10 };
function lineYears(o, m) { return o.years || DEFAULT_LINE_YEARS[m.frequency]; }

/* Texas and the U.S. always get the same look, wherever they appear in
   compareTo. Lubbock (the main line) is always solid teal. */
const FIXED_STYLES = {
  "Texas":         { color: SLATE, width: 3,   dash: [4, 6] },   // dotted
  "United States": { color: TAUPE, width: 3, dash: [14, 6] },   // dashed
};
/* Any other places (peer cities) get these, in the order listed in compareTo.
   Colors borrowed from the CEO's presentation slides. */
const PEER_STYLES = [
  { color: "#8a5a78", width: 2 },   // mauve
  { color: "#c26a5a", width: 2 },   // salmon
  { color: "#5b6770", width: 2 },   // gray
  { color: "#b08d57", width: 2 },   // tan
];

/* Prints each line's latest value at its right end (line setting endLabels: true).
   If two labels would sit on top of each other, the lower one is nudged down. */
function endLabelPlugin(unit) {
  return {
    id: "endLabels",
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      const items = [];
      chart.data.datasets.forEach((ds, i) => {
        const pts = chart.getDatasetMeta(i).data;
        for (let j = ds.data.length - 1; j >= 0; j--) {
          if (ds.data[j] != null) {
            items.push({ x: pts[j].x, y: pts[j].y, text: fmtShort(ds.data[j], unit), color: ds.borderColor });
            break;
          }
        }
      });
      items.sort((a, b) => a.y - b.y);
      for (let k = 1; k < items.length; k++) items[k].y = Math.max(items[k].y, items[k - 1].y + 14);
      ctx.save();
      ctx.font = "600 12px " + Chart.defaults.font.family;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      items.forEach(it => { ctx.fillStyle = it.color; ctx.fillText(it.text, it.x + 6, it.y); });
      ctx.restore();
    },
  };
}

function drawChart(o, index) {
  const m = DATA.metrics[o.metric];
  const geo = pickGeo(m, currentGeo);

  // The main line is the chosen geography (teal). The comparison lines come
  // from the chart's compareTo list, or Texas and the U.S. if it has none.
  const others = (o.compareTo || ["Texas", "United States"]).filter(g => m.series[g] && g !== geo);
  let peer = 0;
  const lines = [{ geo: geo, color: TEAL, width: 4 }]
    .concat(others.map(g => ({ geo: g, ...(FIXED_STYLES[g] || PEER_STYLES[peer++ % PEER_STYLES.length]) })));

  const base = m.series[geo].slice(-(lineYears(o, m) * PER_YEAR[m.frequency]));
  const labels = base.map(p => shortPeriod(p[0], m.frequency));
  const datasets = lines.map(l => {
    const lookup = Object.fromEntries(m.series[l.geo].map(p => [p[0], p[1]]));
    return {
      label: l.geo, data: base.map(p => lookup[p[0]] ?? null),
      borderColor: l.color, backgroundColor: l.color, borderWidth: l.width,
      borderDash: l.dash || [], pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false,
    };
  });

  document.getElementById("legend-" + index).innerHTML =
    lines.map(l => `<span style="--c:${l.color};${l.dash ? `--on:${l.dash[0]}px;--gap:${l.dash[0] + l.dash[1]}px` : ""}">${l.geo}</span>`).join("");

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  charts.push(new Chart(document.getElementById("chart-" + index), {
    type: "line",
    data: { labels, datasets },
	plugins: o.endLabels ? [endLabelPlugin(m.unit)] : [], 
    options: {
      maintainAspectRatio: false,
	  layout: { padding: { right: o.endLabels ? 48 : 0 } }, //room for the end labels
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.raw == null ? "no data" : fmt(c.raw, m.unit)}` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 12, color: "#6b6b6b" } },
        y: { grid: { color: "#eeebe5" }, border: { display: false },
             ticks: { callback: v => m.unit === "percent" ? v + "%" : fmt(v, m.unit), color: "#6b6b6b" } },
      },
    },
  }));
}

/* =====================================================================
   BAR CHARTS: one bar per year, in the style of the CEO's presentations.
   ===================================================================== */

/* Short number format for bar labels and the axis: $110.0M, 243.2K, 91.6 */
function fmtShort(v, unit) {
  if (v == null) return "—";
  if (unit === "percent") return v.toFixed(1) + "%";
  if (["index", "decimal", "years"].includes(unit)) return v.toFixed(1);
  const s = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(v);
  return unit === "dollars" ? "$" + s : s;
}

/* Turn a metric's series into one value per year.
   - Yearly data: used as-is.
   - Monthly/quarterly data with yearly: "sum" or "average": each year's
     months (or quarters) are added up or averaged.
   Only complete years are kept, except the most recent year, which is kept
   and marked "partial" (year to date).For sums, a year with a missing month (like the October 2025
   shutdown) is skipped rather than showing a total that's quietly too low. For averages, it's kept, 
   since 11 months still makes a fair average.   */
function yearlyBars(m, series, how) {
  const real = series.filter(p => p[1] != null);
  if (m.frequency === "annual" || !how) {
    return real.map(p => ({ year: parts(p[0]).y, value: p[1], partial: false }));
  }
  const perYear = { monthly: 12, quarterly: 4 }[m.frequency];
  const groups = {};
  real.forEach(([d, v]) => { const y = parts(d).y; (groups[y] = groups[y] || []).push([d, v]); });
  const years = Object.keys(groups).map(Number).sort((a, b) => a - b);
  const newest = years[years.length - 1];
  const endMonth = { monthly: 12, quarterly: 10 }[m.frequency];   // December, or Q4 (starts Oct 1)
  // A year counts as "complete" when:
  //   sum:     every month (or quarter) is there, so the total isn't too low
  //   average: the data reaches the end of the year; a missing month just
  //            means averaging 11 months instead of 12, which is still fair
  const complete = y => how === "average"
    ? parts(groups[y][groups[y].length - 1][0]).m === endMonth
    : groups[y].length === perYear;
  return years
    .filter(y => complete(y) || y === newest)
    .map(y => {
      const vals = groups[y].map(p => p[1]);
      const total = vals.reduce((a, b) => a + b, 0);
      return {
        year: y,
        value: how === "average" ? total / vals.length : total,
        partial: !complete(y),
        through: groups[y][groups[y].length - 1][0],   // last month/quarter included
      };
    });
}

/* Chart.js has no built-in "print the value on top of the bar," so this
   little add-on (a "plugin") draws it after the bars are drawn. */
function barLabelPlugin(show, unit) {
  return {
    id: "barLabels",
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      const values = chart.data.datasets[0].data;
      ctx.save();
      ctx.font = "600 12px " + Chart.defaults.font.family;
      ctx.fillStyle = "#3d4a55";
      ctx.textAlign = "center";
      chart.getDatasetMeta(0).data.forEach((bar, i) => {
        if (show.includes(i) && values[i] != null) ctx.fillText(fmtShort(values[i], unit), bar.x, bar.y - 7);
      });
      ctx.restore();
    },
  };
}

function drawBars(o, index) {
  const m = DATA.metrics[o.metric];
  const geo = pickGeo(m, currentGeo);
  const allBars = yearlyBars(m, m.series[geo], o.yearly);   // every year the data has
  const bars = allBars.slice(-(o.years || 10));              // just the ones shown
  if (!bars.length) return;
  const n = bars.length;
  const last = bars[n - 1];

  // Labels under the bars. A partial year says "YTD".
  const labels = bars.map(b => b.partial ? `${b.year} YTD` : `${b.year}`);
  // Full years are solid teal; the year-to-date bar is a lighter teal.
  const colors = bars.map(b => b.partial ? "rgba(0, 96, 114, 0.4)" : TEAL);

  // Which bars get a value printed on top.
  const which = o.barLabels || "ends";
  const show = Array.isArray(which) ? which.map(p => p < 0 ? n + p : p - 1)
             : which === "all" ? bars.map((_, i) => i)
             : which === "none" ? []
             : [0, n - 1].concat(last.partial && n > 2 ? [n - 2] : []);

  // Legend line: which geography, and what "YTD" means if there is one.
  let legend = `<span style="--c:${TEAL}">${geo}</span>`;
  if (last.partial) legend += `<span style="--c:rgba(0,96,114,.4)">${last.year} year to date, through ${MONTHS[parts(last.through).m - 1]}</span>`;
  document.getElementById("legend-" + index).innerHTML = legend;

  // The big growth callout, e.g. "+69.2%  2017 vs 2025".
  if (o.callout) {
        const shownFull = bars.filter(b => !b.partial);
    const allFull = allBars.filter(b => !b.partial);
    // "to" = the year we compare TO: the last full year (or the second year in a [from, to] list).
    const to   = Array.isArray(o.callout) ? allBars.find(b => b.year === o.callout[1]) : allFull[allFull.length - 1];
    // "from" = the year we compare FROM:
    //   callout: [2015, 2025] -> exactly those years
    //   callout: 10           -> 10 years before the last full year
    //   callout: true         -> the first full year on the chart
    const from = Array.isArray(o.callout) ? allBars.find(b => b.year === o.callout[0])
               : typeof o.callout === "number" ? (to && allBars.find(b => b.year === to.year - o.callout))
               : shownFull[0];
    if (from && to && from !== to) {
      const DIFF_UNITS = { percent: " pts", index: " pts", years: " yrs" };
      const byDiff = DIFF_UNITS[m.unit];
      const change = byDiff ? to.value - from.value : ((to.value - from.value) / from.value) * 100;
      const goodWhen = o.goodWhen || "up";
      const tone = Math.abs(change) < 0.05 || goodWhen === "neither" ? "flat"
                 : (change > 0) === (goodWhen === "up") ? "good" : "bad";
      const sign = change > 0 ? "+" : change < 0 ? "−" : "";
      document.getElementById("callout-" + index).innerHTML =
        `<span class="callout-num ${tone}">${sign}${Math.abs(change).toFixed(1)}${byDiff || "%"}</span>
         <span class="callout-lbl">${from.year} vs ${to.year}</span>`;
    }
  }

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  charts.push(new Chart(document.getElementById("chart-" + index), {
    type: "bar",
    data: { labels, datasets: [{ label: geo, data: bars.map(b => b.value), backgroundColor: colors, borderRadius: 4, maxBarThickness: 64 }] },
    plugins: [barLabelPlugin(show, m.unit)],
    options: {
      maintainAspectRatio: false,
      layout: { padding: { top: 22 } },   // room for the labels above the tallest bar
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${geo}: ${fmt(c.raw, m.unit)}` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#6b6b6b" } },
        y: { beginAtZero: true, grid: { color: "#eeebe5" }, border: { display: false },
             ticks: { callback: v => fmtShort(v, m.unit), color: "#6b6b6b" } },
      },
    },
  }));
}

/* =====================================================================
   INDUSTRY CHARTS: the ranking bars and the pick-an-industry explorer.
   ===================================================================== */

/* Turns the menu list ("-- Manufacturing") into name, indent level,
   and metric name. Skips anything the data file doesn't have. */
function menuItems(o) {
  return o.menu.map(line => {
    const level = (line.match(/^-+/) || [""])[0].length;
    const name = line.replace(/^-+\s*/, "");
    return { name, level, key: (o.prefix || "") + name };
  }).filter(item => DATA.metrics[item.key]);
}

/* Which industry the explorer shows: the visitor's last pick, or the first one. */
function explorerPick(o) {
  const items = menuItems(o);
  const saved = recall("explorer", "");
  return (items.find(i => i.key === saved) || items[0] || {}).key;
}

/* Long names on the ranking chart wrap onto two lines instead of squeezing the bars. */
function wrapLabel(text, max = 24) {
  const lines = [];
  let line = "";
  text.split(" ").forEach(word => {
    if (line && (line + " " + word).length > max) { lines.push(line); line = word; }
    else line = line ? line + " " + word : word;
  });
  lines.push(line);
  return lines;
}

/* For a ranking chart with views (Sectors / Detailed): which view is showing.
   Remembered per chart title, so it sticks when the visitor comes back. */
function currentView(o) {
  if (!o.views) return null;
  const names = Object.keys(o.views);
  const saved = recall("view-" + o.title, names[0]);
  return names.includes(saved) ? saved : names[0];
}

/* The metric names a ranking chart draws: its metrics list, or the list for
   the view that's showing. Skips anything the data file doesn't have. */
function rankingKeys(o) {
  const list = o.views ? o.views[currentView(o)] : o.metrics;
  return list.map(n => (o.prefix || "") + n).filter(k => DATA.metrics[k]);
}

/* The box for a ranking chart or the explorer (like chartPanel, but these
   are built from a list of metrics instead of one). */
function listPanel(o, index) {
  if (o.type === "ranking") {
    const keys = rankingKeys(o, index);
    if (!keys.length) return "";
    const m = DATA.metrics[keys[0]];
    const geo = pickGeo(m, currentGeo);
    const date = latest(m.series[geo])[0];
    const priorDate = (parts(date).y - 1) + date.slice(4);
    const meta = o.show === "growth"
      ? `${geo} · Change from ${periodLabel(priorDate, m.frequency)} to ${periodLabel(date, m.frequency)} · ${m.source}`
      : `${geo} · ${periodLabel(date, m.frequency)} · Share of ${o.shareOf ? o.shareOf.toLowerCase() + " jobs" : "jobs shown"} · ${m.source}`;
    const view = currentView(o);
    const buttons = o.views ? `<div class="seg" id="views-${index}">${Object.keys(o.views).map(v =>
      `<button data-view="${v}" aria-pressed="${v === view}">${v}</button>`).join("")}</div>` : "";
    return `<section class="panel${o.half ? " half" : ""}">
      <div class="panel-head">
        <div>
          <h2>${o.title}</h2>
          <div class="meta">${meta}</div>
        </div>
        ${buttons}
      </div>
      <div class="legend" id="legend-${index}"></div>
      <div class="chart-box" style="height:${keys.length * (window.innerWidth < 600 ? 46 : 40) + 20}px"><canvas id="chart-${index}"></canvas></div>
      ${o.note ? `<div class="chart-note">${o.note}</div>` : ""}
    </section>`;
  }

  // Explorer: dropdown menu, a one-line summary, then the chart.
  const items = menuItems(o);
  if (!items.length) return "";
  const pick = explorerPick(o);
  const m = DATA.metrics[pick];
  const options = items.map(i =>
    `<option value="${i.key}" ${i.key === pick ? "selected" : ""}>${"    ".repeat(i.level)}${i.name}</option>`).join("");
  return `<section class="panel${o.half ? " half" : ""}">
    <div class="panel-head">
      <div>
        <h2>${o.title}</h2>
        <div class="meta">Change in jobs from the same month a year earlier · Last ${o.years || 5} years · ${m.source}<br>
          Counts are rounded to the nearest hundred, so small industries can swing by several percent on a change of a few hundred jobs.</div>
      </div>
      <label class="picker"><span>Industry</span><select id="pick-${index}">${options}</select></label>
    </div>
    <div class="readout" id="readout-${index}"></div>
    <div class="legend" id="legend-${index}"></div>
    <div class="chart-box"><canvas id="chart-${index}"></canvas></div>
  </section>`;
}

/* Prints each sideways bar's label to its right. */
function hbarLabelPlugin(texts) {
  return {
    id: "hbarLabels",
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      ctx.save();
      ctx.font = "600 12px " + Chart.defaults.font.family;
      ctx.fillStyle = "#3d4a55";
      ctx.textBaseline = "middle";
      chart.getDatasetMeta(0).data.forEach((bar, i) => {
        // Labels sit to the right: past the end of a growing bar,
        // or just right of the zero line for a shrinking one.
        ctx.textAlign = "left";
        ctx.fillText(texts[i], Math.max(bar.x, bar.base) + 6, bar.y);
      });
      ctx.restore();
    },
  };
}

/* Ranking chart: one sideways bar per industry, sorted.
   show: "size"   = jobs, biggest first, labeled "34.9K · 20%"
   show: "growth" = % change from a year ago, labeled "+5.9% (+1,200)" */
function drawRanking(o, index) {
  const keys = rankingKeys(o, index);

  // View buttons (Sectors / Detailed): remember the choice and redraw.
  document.querySelectorAll(`#views-${index} button`).forEach(btn =>
    btn.addEventListener("click", () => { remember("view-" + o.title, btn.dataset.view); render(); }));
  if (!keys.length) return;
  const geo = pickGeo(DATA.metrics[keys[0]], currentGeo);

  let rows = keys.map(k => {
    const m = DATA.metrics[k];
    const s = m.series[geo] || [];
    const [date, value] = latest(s) || [null, null];
    const prior = date ? yearAgo(s, date) : null;
    return { name: m.label, unit: m.unit, value, prior,
             change: prior ? ((value - prior) / prior) * 100 : null,
             diff: prior != null ? value - prior : null };
  });

  let data, colors, texts, xScale;
  if (o.show === "growth") {
    // by: "jobs" ranks by jobs gained or lost; otherwise by percent.
    const byJobs = o.by === "jobs";
    const amount = r => byJobs ? r.diff : r.change;
    rows = rows.filter(r => r.change != null).sort((a, b) => amount(b) - amount(a));
    data = rows.map(amount);
    colors = rows.map(r => r.diff === 0 ? "#9a9087" : r.diff > 0 ? "#028350" : "#b42318");
    const sign = v => v > 0 ? "+" : v < 0 ? "−" : "";
    const jobsText = r => `${sign(r.diff)}${fmt(Math.abs(r.diff), r.unit)}`;
    const pctText = r => `${sign(r.change)}${Math.abs(r.change).toFixed(1)}%`;
    texts = rows.map(r => byJobs ? `${jobsText(r)} (${pctText(r)})` : `${pctText(r)} (${jobsText(r)})`);
    xScale = { min: Math.min(0, ...data), max: Math.max(0, ...data) };
    document.getElementById("legend-" + index).innerHTML =
      `<span style="--c:#028350">Growing</span><span style="--c:#b42318">Shrinking</span>`;
  } else {
    rows = rows.filter(r => r.value != null).sort((a, b) => b.value - a.value);
    data = rows.map(r => r.value);
    colors = rows.map(() => TEAL);
    // The % labels are a share of the shareOf metric (like Total Private), or of the bars shown.
    const whole = o.shareOf && DATA.metrics[(o.prefix || "") + o.shareOf];
    const total = whole ? latest(whole.series[geo])[1] : data.reduce((a, b) => a + b, 0);
    texts = rows.map(r => `${fmtShort(r.value, r.unit)} · ${Math.round((r.value / total) * 100)}%`);
    xScale = { min: 0, max: Math.max(...data) };
  }

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  charts.push(new Chart(document.getElementById("chart-" + index), {
    type: "bar",
    data: { labels: rows.map(r => wrapLabel(r.name, window.innerWidth < 600 ? 15 : 24)), datasets: [{ data, backgroundColor: colors, borderRadius: 4, barPercentage: 0.8 }] },
    plugins: [hbarLabelPlugin(texts)],
    options: {
      indexAxis: "y",
      maintainAspectRatio: false,
      layout: { padding: { right: 115 } },   // room for the labels
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: c => rows[c[0].dataIndex].name,
          label: c => " " + texts[c.dataIndex] + (o.show === "growth" ? " jobs" : " of " + (o.shareOf ? o.shareOf.toLowerCase() + " jobs" : "jobs shown")),
        } },
      },
      scales: {
        x: { ...xScale, ticks: { display: false }, border: { display: false },
             grid: { color: c => c.tick.value === 0 ? "#c9c1b8" : "transparent" } },
        y: { grid: { display: false }, border: { display: false }, ticks: { autoSkip: false, color: "#3d4a55", font: { size: window.innerWidth < 600 ? 11 : 12.5 } } },   // show every name
      },
    },
  }));
}

/* Explorer: the dropdown plus a line chart of the picked industry's
   change from a year ago, Lubbock MSA vs Texas (and the U.S. once it's in the data). */
function drawExplorer(o, index) {
  const key = explorerPick(o);
  if (!key) return;
  const m = DATA.metrics[key];
  const geo = pickGeo(m, currentGeo);

  // Picking a different industry remembers it and redraws the tab.
  document.getElementById("pick-" + index).addEventListener("change", e => {
    remember("explorer", e.target.value);
    render();
  });

  // Turn job counts into "% change from the same month a year ago."
  const yoy = s => s.map(([d, v]) => {
    const p = yearAgo(s, d);
    return [d, v != null && p ? ((v - p) / p) * 100 : null];
  });

  const others = (o.compareTo || ["Texas", "United States"]).filter(g => m.series[g] && g !== geo);
  const lines = [{ geo, color: TEAL, width: 4 }].concat(others.map(g => ({ geo: g, ...FIXED_STYLES[g] })));
  const changes = Object.fromEntries(lines.map(l => [l.geo, yoy(m.series[l.geo])]));

  // One-line summary: "Lubbock MSA: 24,000 jobs, ▲ 0.4% vs Aug 2025 · Texas ▲ 1.9%"
  const [date, value] = latest(m.series[geo]);
  const priorDate = (parts(date).y - 1) + date.slice(4);
  const chg = g => {
    const hit = changes[g].find(p => p[0] === date);
    const v = hit ? hit[1] : null;
    if (v == null) return "—";
    if (Math.abs(v) < 0.05) return "no change";
    return `<span class="arrow ${v > 0 ? "good" : "bad"}">${v > 0 ? "▲" : "▼"}</span> ${Math.abs(v).toFixed(1)}%`;
  };
  document.getElementById("readout-" + index).innerHTML =
    `<b>${m.label}</b> · ${geo}: <b>${fmt(value, m.unit)} jobs</b> in ${periodLabel(date, m.frequency)}, ${chg(geo)} vs ${shortPeriod(priorDate, m.frequency)}` +
    others.map(g => ` · ${g}: ${chg(g)}`).join("");

  const base = changes[geo].slice(-((o.years || 5) * PER_YEAR[m.frequency]));
  const datasets = lines.map(l => {
    const lookup = Object.fromEntries(changes[l.geo].map(p => [p[0], p[1]]));
    return {
      label: l.geo, data: base.map(p => lookup[p[0]] ?? null),
      borderColor: l.color, backgroundColor: l.color, borderWidth: l.width,
      borderDash: l.dash || [], pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false,
    };
  });

  document.getElementById("legend-" + index).innerHTML =
    lines.map(l => `<span style="--c:${l.color};${l.dash ? `--on:${l.dash[0]}px;--gap:${l.dash[0] + l.dash[1]}px` : ""}">${l.geo}</span>`).join("");

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  charts.push(new Chart(document.getElementById("chart-" + index), {
    type: "line",
    data: { labels: base.map(p => shortPeriod(p[0], m.frequency)), datasets },
    plugins: [endLabelPlugin("percent")],
    options: {
      maintainAspectRatio: false,
      layout: { padding: { right: 48 } },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.raw == null ? "no data" : (c.raw > 0 ? "+" : "") + c.raw.toFixed(1) + "%"}` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 12, color: "#6b6b6b" } },
        y: { border: { display: false }, ticks: { callback: v => v + "%", color: "#6b6b6b" },
             grid: { color: c => c.tick.value === 0 ? "#a39686" : "#eeebe5" } },   // darker line at 0%
      },
    },
  }));
}

/* ---------- Draw the current tab ---------- */
function render() {
  const tab = TABS.find(t => t.id === currentTab);

  // Highlight the active tab button.
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.tab === currentTab));

  // Intro sentence, and show the geography switch only on tabs that use it.
  document.getElementById("intro").textContent = tab.intro;
  document.getElementById("geo").style.display = tab.geo ? "" : "none";
  document.querySelectorAll("#geo-switch button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.geo === currentGeo));

  // Clear out the old charts before drawing new ones.
  charts.forEach(c => c.destroy());
  charts = [];

  const content = document.getElementById("content");
  if (!tab.cards.length) {
    content.innerHTML = `<div class="empty"><h2>${tab.label} — Coming Soon</h2>This section is being built. Check back soon.</div>`;
    return;
  }

  content.innerHTML =
    `<div class="grid">${tab.cards.map(card).join("")}</div>` +
    `<div class="charts">${tab.charts.map(chartPanel).join("")}</div>`;
  // Draw each chart with the right drawing code: bars or the original line chart.
  if (window.Chart) tab.charts.forEach((entry, i) => {
    const o = chartOpts(entry);
    if (o.type === "ranking") return drawRanking(o, i);
    if (o.type === "explorer") return drawExplorer(o, i);
    if (!DATA.metrics[o.metric]) return;
    if (o.type === "bars") drawBars(o, i); else drawChart(o, i);
  });
}

/* ---------- Start-up ---------- */
if (!DATA) {
  document.getElementById("content").innerHTML =
    `<div class="error"><b>No data found.</b> Run build_dashboard_data.py first. It creates dashboard_data.js in this folder.</div>`;
} else {
  document.getElementById("updated").textContent = DATA.generated;

  // Create the tab buttons from the TABS list.
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button role="tab" data-tab="${t.id}">${t.label}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTab = btn.dataset.tab;
      remember("tab", currentTab);
      history.replaceState(null, "", "#" + currentTab);
      render();
    });
  });

  // Geography buttons.
  document.querySelectorAll("#geo-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentGeo = btn.dataset.geo;
      remember("geo", currentGeo);
      render();
    });
  });

  render();
}
</script>
